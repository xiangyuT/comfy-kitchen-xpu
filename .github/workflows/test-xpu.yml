name: Test Intel XPU Backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_xpu:
    # This workflow is intentionally manual: GitHub-hosted runners do not expose
    # Intel GPUs. Attach a runner carrying both the `xpu` and `bmg` labels.
    runs-on: [self-hosted, xpu, bmg]
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify preinstalled XPU runtime
        shell: bash
        run: |
          python -c "import torch; assert torch.xpu.is_available(); print(torch.__version__, torch.xpu.get_device_name())"
          python -c "import omni_xpu_kernel; assert omni_xpu_kernel.is_available(); print(omni_xpu_kernel.__version__)"

      - name: Build pure Python Comfy Kitchen wheel
        shell: bash
        run: |
          python -m pip install --upgrade setuptools wheel
          python setup.py bdist_wheel --no-cuda

      - name: Install wheel and test XPU backend
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pip install pytest
          pytest -q tests/test_xpu.py tests/test_backends.py tests/test_int8.py -k "not cuda"
