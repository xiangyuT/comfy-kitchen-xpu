name: Test Intel XPU Backend

on:
  workflow_dispatch:
    inputs:
      device:
        description: Installed omni wheel and runner GPU target
        required: true
        default: ptl-h
        type: choice
        options:
          - ptl-h
          - bmg
      torch_minor:
        description: Expected installed PyTorch major.minor
        required: true
        default: "2.11"

permissions:
  contents: read

jobs:
  test_xpu:
    # This workflow is intentionally manual: GitHub-hosted runners do not expose
    # Intel GPUs. The device label must match the installed wheel's AOT target.
    runs-on: [self-hosted, xpu, "${{ inputs.device }}"]
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify preinstalled XPU runtime
        shell: bash
        env:
          EXPECTED_TORCH_MINOR: ${{ inputs.torch_minor }}
          EXPECTED_XPU_TARGET: ${{ inputs.device }}
        run: |
          python - <<'PY'
          import os
          import torch
          import omni_xpu_kernel

          expected_minor = os.environ["EXPECTED_TORCH_MINOR"]
          expected_target = os.environ["EXPECTED_XPU_TARGET"]
          torch_minor = ".".join(torch.__version__.split("+", 1)[0].split(".")[:2])
          package_minor = ".".join(omni_xpu_kernel.__torch_version__.split(".")[:2])

          assert torch.xpu.is_available(), "PyTorch XPU is unavailable"
          assert omni_xpu_kernel.is_available(), "omni native extension is unavailable"
          assert torch_minor == expected_minor, (torch.__version__, expected_minor)
          assert package_minor == expected_minor, (
              omni_xpu_kernel.__torch_version__, expected_minor
          )
          assert omni_xpu_kernel.__xpu_target__ == expected_target
          assert omni_xpu_kernel.core_aot_target() == expected_target
          print(
              torch.__version__,
              omni_xpu_kernel.__version__,
              torch.xpu.get_device_name(),
          )
          PY

      - name: Build pure Python Comfy Kitchen wheel
        shell: bash
        run: |
          python -m pip install --upgrade setuptools wheel
          python setup.py bdist_wheel --no-cuda

      - name: Install wheel and test XPU backend
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pip install pytest
          pytest -q tests/test_xpu.py tests/test_backends.py tests/test_int8.py -k "not cuda"
