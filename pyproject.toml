[build-system]
requires = [
    "setuptools>=77.0.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "comfy-kitchen"
version = "0.2.26"
description = "Intel XPU kernel integration for ComfyUI"
readme = "packaging/XPU_WHEEL_README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["pytorch", "xpu", "intel", "quantization", "kernels", "diffusion"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/xiangyuT/comfy-kitchen-xpu"
Upstream = "https://github.com/Comfy-Org/comfy-kitchen"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.1.0",
]
build = [
    "build>=1.2.0",
    "setuptools>=77.0.0",
    "wheel",
]

[tool.setuptools]
# MANIFEST.in makes native sources available to source builds. Wheels need only
# the compiled extensions and explicitly declared runtime data below.
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["comfy_kitchen*"]
exclude = [
    "tests*",
    "comfy_kitchen.backends.cuda*",
    "comfy_kitchen.backends.hip*",
]

[tool.ruff]
# Set the maximum line length to 100.
line-length = 100

# Assume Python 3.10 (lowest supported)
target-version = "py310"

# Exclude commonly ignored directories
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".pytest_cache",
    "third_party",
]

[tool.ruff.lint]
# Enable pycodestyle (`E`), Pyflakes (`F`), and isort (`I`) by default
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "RUF",   # Ruff-specific rules
]

# Ignore specific rules
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Do not perform function call in argument defaults
    "N802",  # Function name should be lowercase (ComfyUI Nodes)
    "RUF022",
    "SIM108",
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Respect magic trailing commas
skip-magic-trailing-comma = false

# Auto-detect line endings
line-ending = "auto"
